name: Build mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Testar variantes do Forge
        run: |
          B=net/minecraftforge/forge/1.12.2-14.23.5.2860/forge-1.12.2-14.23.5.2860
          for h in https://maven.minecraftforge.net https://files.minecraftforge.net/maven https://bmclapi2.bangbang93.com/maven; do
            for c in userdev userdev3 universal installer; do
              echo "$h $c: $(curl -s -o /dev/null -w '%{http_code}' -L -A 'Mozilla/5.0' $h/$B-$c.jar)"
            done
          done
