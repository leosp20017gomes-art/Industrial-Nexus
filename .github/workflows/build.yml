name: Build mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
      - name: Instalar Gradle 4.10.3
        run: |
          wget -q https://services.gradle.org/distributions/gradle-4.10.3-bin.zip
          unzip -q gradle-4.10.3-bin.zip
      - name: Compilar
        run: ./gradle-4.10.3/bin/gradle setupCiWorkspace build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: IndustrialNexus-jar
          path: build/libs/*.jar
