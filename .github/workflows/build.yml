name: Build mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
      - name: Escolher versao do Forge
        run: |
          FOUND=""
          for v in 2860 2859 2858 2857 2856 2855 2854 2852 2851 2847 2838 2837 2836 2825 2815 2768; do
            F=1.12.2-14.23.5.$v
            C=$(curl -s -o /dev/null -w '%{http_code}' -L -A 'Mozilla/5.0' https://maven.minecraftforge.net/net/minecraftforge/forge/$F/forge-$F-userdev.jar)
            echo "$F: $C"
            if [ "$C" = "200" ] && [ -z "$FOUND" ]; then FOUND=$F; fi
          done
          echo "Escolhido: $FOUND"
          if [ -n "$FOUND" ]; then sed -i "s/1.12.2-14.23.5.2860/$FOUND/" build.gradle; fi
      - name: Corrigir nomes do codigo
        run: |
          grep -rl setUnlocalizedName src | xargs -r sed -i 's/setUnlocalizedName/setTranslationKey/g'
      - name: Instalar Gradle 4.10.3
        run: |
          wget -q https://services.gradle.org/distributions/gradle-4.10.3-bin.zip
          unzip -q gradle-4.10.3-bin.zip
      - name: Compilar
        run: |
          set -o pipefail
          ./gradle-4.10.3/bin/gradle setupCiWorkspace build --no-daemon 2>&1 | tee build.log
      - name: Mostrar erros
        if: failure()
        run: grep -A3 "error:" build.log | head -80
      - uses: actions/upload-artifact@v4
        with:
          name: IndustrialNexus-jar
          path: build/libs/*.jar
